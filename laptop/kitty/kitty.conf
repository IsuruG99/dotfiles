# Transparency
background_opacity 0.88
# Force monochrome glyphs for specific Unicode ranges
symbol_map U+F015-U+F017,U+F1AD-U+F1B0,U+F17B-U+F1F0 JetBrains Mono Nerd Font

# Disable emoji variation selectors
emoji_variation_selector none
# Font
# font_family       JetBrains Mono Nerd Font
# bold_font         JetBrains Mono Bold
# italic_font       JetBrains Mono Italic
# bold_italic_font  JetBrains Mono Bold Italic
font_family      "JetBrains Mono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0  

cursor_shape block
cursor_beam_thickness 1.5
cursor_underline_thickness 2

scrollback_lines 10000

mouse_hide_wait 3.0
copy_on_select clipboard
shell_integration enabled
confirm_os_window_close -1
# BEGIN_KITTY_THEME
# Duskfox
include current-theme.conf
# END_KITTY_THEME
